name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Compile and test
        run: mvn -B verify

  downstream-dl:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Install yishape-math
        run: mvn -B install -DskipTests
      - name: Checkout yishape-dl
        uses: actions/checkout@v4
        with:
          repository: ScaleFree-Tech/yishape-dl
          path: ../yishape-dl
      - name: Compile yishape-dl against installed yishape-math
        run: mvn -B compile -f ../yishape-dl/pom.xml
