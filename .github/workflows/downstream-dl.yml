# Verify yishape-dl compiles against the latest yishape-math.
# Manual trigger only — the yishape-dl repo may not always be public.

name: Downstream (yishape-dl)

on:
  workflow_dispatch:

jobs:
  compile-dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install yishape-math
        run: mvn -B install -DskipTests

      - name: Checkout yishape-dl
        uses: actions/checkout@v4
        with:
          repository: ScaleFree-Tech/yishape-dl
          path: ../yishape-dl

      - name: Compile yishape-dl against installed yishape-math
        run: mvn -B compile -f ../yishape-dl/pom.xml
