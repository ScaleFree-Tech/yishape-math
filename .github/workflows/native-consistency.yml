# End-to-end consistency test: Java CPU vs native backends.
# Runs weekly (Monday 03:00 UTC) and on manual trigger.
# GPU job commented out — pending GPU repo setup.

name: Native Consistency

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

jobs:
  cpu-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Run CrossBackendConsistencyTest (CPU-only)
        run: |
          mvn -B test \
            -Dtest="com.yishape.lab.math.autodiff.graph.CrossBackendConsistencyTest" \
            -DfailIfNoTests=false \
            -Dyishape.gpu.minElements=0 \
            -Dyishape.hpc.minElements=0

  hpc-consistency:
    runs-on: ubuntu-latest
    needs: cpu-baseline
    steps:
      - name: Checkout yishape-math
        uses: actions/checkout@v4

      - name: Checkout yishape-math-hpc
        uses: actions/checkout@v4
        with:
          repository: ScaleFree-Tech/yishape-math-hpc
          path: ../yishape-math-hpc

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install HPC bridge (mvn install)
        working-directory: ../yishape-math-hpc
        run: mvn -B install -DskipTests

      - name: Run CrossBackendConsistencyTest (with HPC)
        run: |
          mvn -B test \
            -Dtest="com.yishape.lab.math.autodiff.graph.CrossBackendConsistencyTest" \
            -DfailIfNoTests=false \
            -Dyishape.gpu.minElements=0 \
            -Dyishape.hpc.minElements=0
        continue-on-error: true

      - name: Upload HPC diff reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hpc-consistency-diffs
          path: target/surefire-reports/
          retention-days: 14
