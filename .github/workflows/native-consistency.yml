name: Native Consistency (Layer 3)

on:
  workflow_dispatch:
    inputs:
      rust-ref:
        description: 'Git ref for yishape-math-hpc Rust'
        default: 'main'
  schedule:
    # Weekly: Monday 03:00 UTC
    - cron: '17 3 * * 1'

jobs:
  # ── Job 0: CPU-only baseline (always runs) ──────────────────────────
  cpu-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Run CrossBackendConsistencyTest (CPU-only)
        run: |
          mvn -B test \
            -Dtest="com.yishape.lab.math.autodiff.graph.CrossBackendConsistencyTest" \
            -DfailIfNoTests=false \
            -Dyishape.gpu.minElements=0 \
            -Dyishape.hpc.minElements=0
        # HPC/GPU tests gracefully skip when native libs absent.
        # This baseline ensures the test framework itself is healthy.

  # ── Job 1: HPC consistency (build Rust → install bridge → test) ────
  hpc-consistency:
    runs-on: ubuntu-latest
    needs: cpu-baseline
    steps:
      - name: Checkout yishape-math (main)
        uses: actions/checkout@v4

      - name: Checkout yishape-math-hpc (bridge)
        uses: actions/checkout@v4
        with:
          repository: ScaleFree-Tech/yishape-math-hpc
          path: ../yishape-math-hpc

      - name: Checkout yishape_math_rust (Rust HPC)
        uses: actions/checkout@v4
        with:
          repository: ScaleFree-Tech/yishape_math_rust
          path: ../yishape_math_rust
          ref: ${{ inputs.rust-ref || 'main' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build Rust HPC library
        working-directory: ../yishape_math_rust
        run: cargo build --release

      - name: Copy HPC .so to bridge libs
        run: |
          mkdir -p ../yishape-math-hpc/libs/linux-x86_64/
          cp ../yishape_math_rust/target/release/libyishape_math_rust.so \
             ../yishape-math-hpc/libs/linux-x86_64/

      - name: Install HPC bridge (mvn install)
        working-directory: ../yishape-math-hpc
        run: mvn -B install -DskipTests

      - name: Run CrossBackendConsistencyTest (with HPC)
        run: |
          mvn -B test \
            -Dtest="com.yishape.lab.math.autodiff.graph.CrossBackendConsistencyTest" \
            -DfailIfNoTests=false \
            -Dyishape.gpu.minElements=0 \
            -Dyishape.hpc.minElements=0
        continue-on-error: true

      - name: Upload HPC diff reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hpc-consistency-diffs
          path: target/surefire-reports/
          retention-days: 14

