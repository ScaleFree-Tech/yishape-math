name: Schema Consistency Check

# ═══════════════════════════════════════════════════════════════
# CI enforcement: generated code MUST match OpRegistry source of truth.
#
# On every PR/push: runs CodegenTool, then git diff --exit-code.
# If generated files are out of sync with OpRegistry → CI fails.
# ═══════════════════════════════════════════════════════════════

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run CodegenTool
        run: mvn compile exec:java -Dexec.mainClass="com.yishape.lab.math.codegen.CodegenTool" --no-transfer-progress

      - name: Check for uncommitted generated changes
        run: |
          STATUS=0
          for f in \
            'src/main/java/com/yishape/lab/math/autodiff/graph/GraphOpSchema.java' \
            'docs/op_schema.md'; do
            if ! git diff --exit-code -- "$f"; then
              echo ""
              echo "❌ FAIL: $f is out of sync with OpRegistry."
              STATUS=1
            fi
          done
          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "   Run: mvn exec:java -Dexec.mainClass=\"com.yishape.lab.math.codegen.CodegenTool\""
            echo "   Then commit the updated generated files."
            exit 1
          fi
          echo "✅ Generated code and docs match OpRegistry."

  # ── Optional: Rust dispatch check (when Rust toolchain available) ──
  rust-dispatch-check:
    runs-on: ubuntu-latest
    needs: schema-check
    if: github.event_name == 'workflow_dispatch'  # Manual only
    steps:
      - uses: actions/checkout@v4
      - name: Verify Rust dispatch stubs exist
        run: |
          if [ ! -f target/generated-rust/graph_ops_dispatch_gpu.rs ] || \
             [ ! -f target/generated-rust/graph_ops_dispatch_hpc.rs ]; then
            echo "❌ FAIL: Rust dispatch files not generated."
            exit 1
          fi
          echo "✅ Rust dispatch stubs generated."
