ops:

  # ─── Binary element-wise ───
  - tag: add
    category: binary
    arity: 2
    gpu: true
    hpc: true
    description: "Element-wise addition"

  - tag: sub
    category: binary
    arity: 2
    gpu: true
    hpc: true
    description: "Element-wise subtraction"

  - tag: mul
