# ops.yaml — Single Source of Truth for all compute ops
# ═══════════════════════════════════════════════════════════════
# This file is the ONE authoritative registry of every operation
# available across CPU, GPU (wgpu), and HPC (faer) backends.
#
# Generated code (Java GraphOpSchema, Rust dispatch match arms,
# op_schema.md) MUST be regenerated whenever this file changes.
#
# CI enforces: git diff --exit-code after codegen
# ═══════════════════════════════════════════════════════════════

version: 1
generated: "2026-06-17"

# ── Backend capability flags ──
backends:
  gpu:
    name: "GPU (wgpu)"
    precision: f32
    max_dims: 6
  hpc:
    name: "HPC (faer)"
    precision: f64
    max_dims: 6

# ── Op category enum ──
# Used by generate: OpCategory enum, describeTag(), doc tables
categories:
  binary:         "Element-wise Binary"
  binary_scalar:  "Scalar Broadcast"
  unary:          "Element-wise Unary"
  activation:     "Activation Function"
  reduce:         "Reduction"
  linalg:         "Linear Algebra"
  normalization:  "Normalization"
  shape:          "Shape Operation"
  indexing:       "Indexing / Gather"
  dl:             "Deep Learning Ops"
  loss:           "Loss Function"
  meta:           "Meta / Graph"

# ── Scalar parameter metadata ──
scalar_params:
  - tag: exponent
    type: f64
    ops: [pow, powSum, powMean]
  - tag: alpha
    type: f64
    ops: [leakyRelu, elu, softplus]
  - tag: beta
    type: f64
    ops: [selu]
  - tag: maxVal
    type: f64
    ops: [hardtanh, clamp]
  - tag: minVal
    type: f64
    ops: [hardtanh, clamp]
  - tag: epsilon
    type: f64
    ops: [layerNorm, batchNorm, batchNorm2d, rmsNorm, groupNorm, instanceNorm]
  - tag: dropoutRate
    type: f64
    ops: [dropout, scaledDotProductAttention]

# ── Fusion pattern registry ──
# {unaryTag}{ReduceTag} pattern: e.g. "square" + "mean" → "squareMean"
fusion:
  # Unary ops that participate in {unary}{Reduce} fusion (19 tags)
  unary_tags: [square, relu, exp, abs, log, sigmoid, tanh, silu, pow, gelu,
               mish, sin, cos, leakyRelu, elu, selu, softplus, hardtanh, mul]

  # Reduction terminators
  reduce_tags: [sum, mean]

  # Compound specials (non-{unary}{Reduce} pattern)
  compound_specials:
    - tag: logSumExp
      gpu: true
      hpc: true
    - tag: softmaxCrossEntropy
      gpu: true
      hpc: true
    - tag: softmaxCrossEntropySparse
      gpu: true
      hpc: true
    - tag: bceLoss
      gpu: true
      hpc: true
    - tag: focalLoss
      gpu: false
      hpc: true
    - tag: diceLoss
      gpu: false
      hpc: true

# ── Backend-specific fused pattern subsets ──
# If omitted, the backend supports ALL {unary}×{reduce} patterns.
# Listed here to track which are actually implemented in WGSL/faer.
backend_fused:
  gpu:
    pattern: [squareSum, squareMean, reluSum, reluMean, expSum, expMean,
              absSum, absMean, logSum, logMean, sigmoidSum, sigmoidMean,
              tanhSum, tanhMean, siluSum, siluMean, mishSum, mishMean,
              geluSum, geluMean, sinSum, sinMean, cosSum, cosMean,
              leakyReluSum, leakyReluMean, eluSum, eluMean, seluSum, seluMean,
              softplusSum, softplusMean, hardtanhSum, hardtanhMean,
              mulSum, mulMean, powSum, powMean]
  hpc:
    pattern: [squareSum, squareMean, reluSum, reluMean, expSum, expMean,
              absSum, absMean, logSum, logMean, sigmoidSum, sigmoidMean,
              tanhSum, tanhMean, siluSum, siluMean, mishSum, mishMean,
              mulSum, mulMean, powSum, powMean,
              geluSum, geluMean, sinSum, sinMean, cosSum, cosMean,
              leakyReluSum, leakyReluMean, eluSum, eluMean,
              seluSum, seluMean, softplusSum, softplusMean,
              hardtanhSum, hardtanhMean]

# ═══════════════════════════════════════════════════════════════
# Op definitions — the authoritative registry
