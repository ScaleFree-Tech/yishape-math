# ═══════════════════════════════════════════════════════════════
# Complex DL op schemas — for input/output contract generation
# Used by GraphOpSchemaValidator and CustomOp implementations
# ═══════════════════════════════════════════════════════════════

complex_ops:
  mha:
    description: "Multi-Head Self/Cross Attention with combined QKV projection"
    inputs:
      - { name: x, index: 0, shape: "[seqLen * dModel]", description: "Input sequence (flat)" }
      - { name: wqkv, index: 1, shape: "[qkvWidth * dModel]", description: "Combined QKV weight (row-major)" }
      - { name: qkvBias, index: 2, shape: "[qkvWidth]", description: "QKV bias", optional: hasBias }
      - { name: wo, index: 3, shape: "[dModel * dModel]", description: "Output projection weight (row-major)" }
      - { name: outBias, index: 4, shape: "[dModel]", description: "Output bias", optional: hasBias }
    len_no_bias: 3
    len_with_bias: 5
    scalar_fields:
      - { name: numHeads, shift: 32, mask: "0xFFFF", description: "Number of attention heads" }
      - { name: numKVHeads, shift: 16, mask: "0xFFFF", description: "Number of KV heads (GQA)" }
      - { name: dModel, shift: 0, mask: "0xFFFF", description: "Model dimension" }
    scalar2_fields:
      - { name: seqLen, shift: 32, mask: "0xFFFF", description: "Sequence length" }
      - { name: causal, shift: 1, mask: "0x1", description: "Causal mask flag (bit)" }
      - { name: hasBias, shift: 0, mask: "0x1", description: "Has bias flag (bit)" }
    backward_grads:
      - { name: d_x, index: 0, condition: always }
      - { name: d_wqkv, index: 1, condition: always }
      - { name: d_qkvBias, index: 2, condition: hasBias }
      - { name: d_wo, index: 3, condition: always }
      - { name: d_outBias, index: 4, condition: hasBias }

  linear:
    description: "Fully Connected (Linear) layer"
    inputs:
      - { name: x, index: 0, shape: "[batch * inFeatures]", description: "Input (flat)" }
      - { name: weight, index: 1, shape: "[outFeatures * inFeatures]", description: "Weight matrix (row-major)" }
      - { name: bias, index: 2, shape: "[outFeatures]", description: "Bias vector", optional: hasBias }
    len_no_bias: 2
    len_with_bias: 3
    scalar_fields:
      - { name: batchSize, shift: 32, mask: "0xFFFF", description: "Batch size" }
      - { name: outFeatures, shift: 16, mask: "0xFFFF", description: "Output features" }
      - { name: inFeatures, shift: 0, mask: "0xFFFF", description: "Input features" }
    backward_grads:
      - { name: d_x, index: 0, condition: always }
      - { name: d_weight, index: 1, condition: always }
      - { name: d_bias, index: 2, condition: hasBias }

  conv2d:
    description: "2D Convolution"
    inputs:
      - { name: x, index: 0, shape: "[B * C * H * W]", description: "Input (NCHW flat)" }
      - { name: weight, index: 1, shape: "[outCh * C * kH * kW]", description: "Weight (row-major)" }
      - { name: bias, index: 2, shape: "[outCh]", description: "Bias vector", optional: hasBias }
    len_no_bias: 2
    len_with_bias: 3
    scalar_fields:
      - { name: packedShape, shift: 0, mask: "0xFFFFFFFFFFFFFFFF", description: "B,C,H,W,outCh,kH,kW,stride,pad" }
    backward_grads:
      - { name: d_x, index: 0, condition: always }
      - { name: d_weight, index: 1, condition: always }
      - { name: d_bias, index: 2, condition: hasBias }

  batchNorm2d:
    description: "Batch Normalization 2D (training mode)"
    inputs:
      - { name: x, index: 0, shape: "[N * C * H * W]", description: "Input (flat)" }
      - { name: gamma, index: 1, shape: "[C]", description: "Scale parameter" }
      - { name: beta, index: 2, shape: "[C]", description: "Shift parameter" }
    len_no_bias: 3
    len_with_bias: 3
    scalar_fields:
      - { name: N, shift: 32, mask: "0xFFFF", description: "Batch size" }
      - { name: C, shift: 16, mask: "0xFFFF", description: "Channels" }
      - { name: HW, shift: 0, mask: "0xFFFF", description: "Spatial size (H*W)" }
    backward_grads:
      - { name: d_x, index: 0, condition: always }
      - { name: d_gamma, index: 1, condition: always }
      - { name: d_beta, index: 2, condition: always }

  layerNorm:
    description: "Layer Normalization"
    inputs:
      - { name: x, index: 0, shape: "[batch * features]", description: "Input (flat)" }
      - { name: gamma, index: 1, shape: "[features]", description: "Scale parameter" }
      - { name: beta, index: 2, shape: "[features]", description: "Shift parameter" }
    len_no_bias: 3
    len_with_bias: 3
    scalar_fields:
      - { name: batchSize, shift: 32, mask: "0xFFFF", description: "Batch size" }
      - { name: features, shift: 16, mask: "0xFFFF", description: "Feature dimension" }
      - { name: eps_bits, shift: 0, mask: "0xFFFF", description: "Epsilon bits" }
    backward_grads:
      - { name: d_x, index: 0, condition: always }
      - { name: d_gamma, index: 1, condition: always }
      - { name: d_beta, index: 2, condition: always }

  rmsNorm:
    description: "RMS Normalization (no re-centering)"
    inputs:
      - { name: x, index: 0, shape: "[batch * features]", description: "Input (flat)" }
      - { name: gamma, index: 1, shape: "[features]", description: "Scale parameter" }
    len_no_bias: 2
    len_with_bias: 2
    backward_grads:
      - { name: d_x, index: 0, condition: always }
      - { name: d_gamma, index: 1, condition: always }

  lstmStep:
    description: "LSTM Single Timestep with fused gates"
    inputs:
      - { name: x, index: 0, shape: "[inputSize]", description: "Input at current timestep" }
      - { name: h_prev, index: 1, shape: "[hiddenSize]", description: "Previous hidden state" }
      - { name: c_prev, index: 2, shape: "[hiddenSize]", description: "Previous cell state" }
      - { name: wI, index: 3, shape: "[4H * inputSize]", description: "Input-to-hidden weight" }
      - { name: wH, index: 4, shape: "[4H * hiddenSize]", description: "Hidden-to-hidden weight" }
      - { name: biasI, index: 5, shape: "[4H]", description: "Input bias", optional: hasBias }
      - { name: biasH, index: 6, shape: "[4H]", description: "Hidden bias", optional: hasBias }
    len_no_bias: 5
    len_with_bias: 7
    scalar_fields:
      - { name: hiddenSize, shift: 0, mask: "0xFFFFFFFF", description: "Hidden size (as plain double)" }
    backward_grads:
      - { name: d_x, index: 0, condition: always }
      - { name: d_hPrev, index: 1, condition: always }
      - { name: d_cPrev, index: 2, condition: always }
      - { name: d_wI, index: 3, condition: always }
      - { name: d_wH, index: 4, condition: always }
      - { name: d_biasI, index: 5, condition: hasBias }
      - { name: d_biasH, index: 6, condition: hasBias }

  embedding:
    description: "Embedding Lookup (row-wise)"
    inputs:
      - { name: weight, index: 0, shape: "[vocabSize * embeddingDim]", description: "Embedding table (row-major)" }
      - { name: indices, index: 1, shape: "[numIndices]", description: "Token indices (as f64)" }
    len_no_bias: 2
    len_with_bias: 2
    backward_grads:
      - { name: d_weight, index: 0, condition: always }

  maxpool2d:
    description: "Max Pooling 2D"
    inputs:
      - { name: x, index: 0, shape: "[B * C * H * W]", description: "Input (flat)" }
    len_no_bias: 1
    len_with_bias: 1
    scalar_fields:
      - { name: packed, shift: 0, mask: "0xFFFFFFFFFFFFFFFF", description: "kernelH, kernelW, stride, padding" }
    backward_grads:
      - { name: d_x, index: 0, condition: always }

  avgpool2d:
    description: "Average Pooling 2D"
    inputs:
      - { name: x, index: 0, shape: "[B * C * H * W]", description: "Input (flat)" }
    len_no_bias: 1
    len_with_bias: 1
    scalar_fields:
      - { name: kH_kW_stride, shift: 0, mask: "0xFFFFFFFFFFFFFFFF", description: "kH<<16 | kW<<8 | stride" }
    scalar2_fields:
      - { name: padding, shift: 0, mask: "0xFFFFFFFFFFFFFFFF", description: "padding<<16" }
    backward_grads:
      - { name: d_x, index: 0, condition: always }

  adaptiveAvgPool2d:
    description: "Adaptive Average Pooling 2D"
    inputs:
      - { name: x, index: 0, shape: "[B * C * H * W]", description: "Input (flat)" }
    len_no_bias: 1
    len_with_bias: 1
    scalar_fields:
      - { name: outH_outW, shift: 0, mask: "0xFFFFFFFFFFFFFFFF", description: "outH<<16 | outW" }
    backward_grads:
      - { name: d_x, index: 0, condition: always }

  scaledDotProductAttention:
    description: "Scaled Dot-Product Attention (Q·K^T + softmax + V)"
    inputs:
      - { name: q, index: 0, shape: "[batch * seqQ * dk]", description: "Query (flat)" }
      - { name: k, index: 1, shape: "[batch * seqK * dk]", description: "Key (flat)" }
      - { name: v, index: 2, shape: "[batch * seqK * dv]", description: "Value (flat)" }
    len_no_bias: 3
    len_with_bias: 3
    scalar_fields:
      - { name: dropout, shift: 0, mask: "0xFFFFFFFFFFFFFFFF", description: "Dropout rate (as f64)" }
    backward_grads:
      - { name: d_q, index: 0, condition: always }
      - { name: d_k, index: 1, condition: always }
      - { name: d_v, index: 2, condition: always }

  groupNorm:
    description: "Group Normalization"
    inputs:
      - { name: x, index: 0, shape: "[B * C * H * W]", description: "Input (flat)" }
      - { name: gamma, index: 1, shape: "[C]", description: "Scale per channel" }
      - { name: beta, index: 2, shape: "[C]", description: "Shift per channel" }
    len_no_bias: 3
    len_with_bias: 3
    scalar_fields:
      - { name: numGroups, shift: 0, mask: "0xFFFFFFFFFFFFFFFF", description: "Number of groups" }
    backward_grads:
      - { name: d_x, index: 0, condition: always }
      - { name: d_gamma, index: 1, condition: always }
      - { name: d_beta, index: 2, condition: always }

  instanceNorm:
    description: "Instance Normalization (per-sample, per-channel)"
    inputs:
      - { name: x, index: 0, shape: "[N * C * H * W]", description: "Input (flat)" }
      - { name: gamma, index: 1, shape: "[C]", description: "Scale per channel (optional)" }
      - { name: beta, index: 2, shape: "[C]", description: "Shift per channel (optional)" }
    len_no_bias: 3
    len_with_bias: 3
    scalar_fields:
      - { name: features, shift: 0, mask: "0xFFFFFFFFFFFFFFFF", description: "Number of features (C)" }
    backward_grads:
      - { name: d_x, index: 0, condition: always }
      - { name: d_gamma, index: 1, condition: always }
      - { name: d_beta, index: 2, condition: always }

  depthwiseConv1d:
    description: "Depthwise 1D Convolution (Mamba SSM)"
    inputs:
      - { name: x, index: 0, shape: "[B * C * L]", description: "Input (BLC flat)" }
      - { name: weight, index: 1, shape: "[C * kernelSize]", description: "Per-channel conv weight" }
    len_no_bias: 2
    len_with_bias: 2
    scalar_fields:
      - { name: packed, shift: 0, mask: "0xFFFFFFFFFFFFFFFF", description: "B, C, L, kernelSize, padding" }
    backward_grads:
      - { name: d_x, index: 0, condition: always }
      - { name: d_weight, index: 1, condition: always }

  selectiveScan:
    description: "Selective Scan (Mamba SSM)"
    inputs:
      - { name: u, index: 0, shape: "[seqLen * dim]", description: "Input sequence (flat)" }
      - { name: delta, index: 1, shape: "[seqLen * dim]", description: "Delta (time step)" }
      - { name: A, index: 2, shape: "[dim * stateSize]", description: "State matrix A" }
      - { name: B, index: 3, shape: "[seqLen * stateSize]", description: "Input projection B" }
      - { name: C, index: 4, shape: "[seqLen * stateSize]", description: "Output projection C" }
      - { name: D, index: 5, shape: "[dim]", description: "Skip connection D (optional)", optional: hasD }
    len_no_bias: 5
    len_with_bias: 6
    scalar_fields:
      - { name: packed, shift: 0, mask: "0xFFFFFFFFFFFFFFFF", description: "seqLen, dim, stateSize" }
    backward_grads:
      - { name: d_u, index: 0, condition: always }
      - { name: d_delta, index: 1, condition: always }
      - { name: d_A, index: 2, condition: always }
      - { name: d_B, index: 3, condition: always }
      - { name: d_C, index: 4, condition: always }
      - { name: d_D, index: 5, condition: hasD }
